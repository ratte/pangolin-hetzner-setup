<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="Architecture of the Pangolin server on Hetzner">
  
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .t { font-weight: 600; font-size: 15px; }
    .s { font-size: 11.5px; }
    .m, .lbl { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; }
    .box { stroke-width: 1.2; }
    .server { fill: none; stroke-width: 1.6; }
    .docker { fill: none; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .e { fill: none; stroke-width: 1.8; }
    .wg { stroke-dasharray: 7 4; }
    .deny.d { stroke-dasharray: 4 4; }
    .bg { fill: #f5f7f9; }
    text { fill: #18212b; }
    .s, .lbl { fill: #5d6b79; }
    .box { fill: #ffffff; stroke: #b9c4cf; }
    .server { stroke: #18212b; }
    .wall, .row { fill: #e6ebf0; }
    .docker { stroke: #b9c4cf; }
    .chip { fill: #ffffff; stroke: #b9c4cf; }
    .chip.no { stroke: #c8402f; }
    .admin { stroke: #18212b; }
    .https { stroke: #2563c9; }
    .wg { stroke: #0f8f6c; }
    .deny { stroke: #c8402f; }
    .ha { fill: #18212b; } .hh { fill: #2563c9; } .hw { fill: #0f8f6c; } .hd { fill: #c8402f; }
    text.c-wg { fill: #0f8f6c; } text.c-deny { fill: #c8402f; }
    @media (prefers-color-scheme: dark) {
    .bg { fill: #11171d; }
    text { fill: #e3e9ef; }
    .s, .lbl { fill: #8e9cab; }
    .box { fill: #1a222b; stroke: #3b4855; }
    .server { stroke: #e3e9ef; }
    .wall, .row { fill: #222c36; }
    .docker { stroke: #3b4855; }
    .chip { fill: #1a222b; stroke: #3b4855; }
    .chip.no { stroke: #f07563; }
    .admin { stroke: #e3e9ef; }
    .https { stroke: #6ea2ff; }
    .wg { stroke: #3cc79e; }
    .deny { stroke: #f07563; }
    .ha { fill: #e3e9ef; } .hh { fill: #6ea2ff; } .hw { fill: #3cc79e; } .hd { fill: #f07563; }
    text.c-wg { fill: #3cc79e; } text.c-deny { fill: #f07563; }
    }
  </style>
  <rect class="bg" fill="#f5f7f9" x="0" y="0" width="1200" height="790" rx="12"/>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ha" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hh" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hw" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Server and firewall wall -->
  <rect class="wall" x="330" y="130" width="60" height="600"/>
  <rect class="server" x="330" y="130" width="830" height="600" rx="10"/>
  <text class="t" x="410" y="160">Hetzner CX23</text>
  <text class="s" x="520" y="160">Ubuntu 26.04</text>
    <text class="m" x="360" y="160" text-anchor="middle">ufw</text>

  <!-- Docker area -->
  <rect class="docker" x="420" y="290" width="710" height="420" rx="8"/>
  <text class="lbl" x="436" y="312">docker · /opt/pangolin</text>

  <!-- Edges (below the boxes) -->
  <path class="e admin" d="M140 150 V60 H378" marker-end="url(#ma)"/>
  <text class="lbl" x="160" y="52">tofu apply</text>
  <path class="e admin" d="M480 90 V128" marker-end="url(#ma)"/>
  <text class="lbl" x="490" y="116">cloud-init</text>

  <path class="e admin" d="M240 205 H428" marker-end="url(#ma)"/>
  <text class="lbl" x="252" y="197">ssh</text>
  <path class="e deny d" d="M240 250 H334"/>

  <path class="e admin" d="M630 210 H668" marker-end="url(#ma)"/>
  <path class="e deny" d="M740 245 V270 H392" marker-end="url(#md)"/>
  <text class="lbl" x="560" y="264">ban</text>

  <path class="e https" d="M240 420 H478" marker-end="url(#mh)"/>
  <text class="lbl" x="252" y="412">https</text>
  <path class="e https" d="M750 405 H848" marker-end="url(#mh)"/>
  <path class="e https" d="M750 455 H848" marker-end="url(#mh)"/>
  <text class="lbl" x="835" y="112">HTTP-01</text>

  <path class="e admin" d="M780 505 H848" marker-end="url(#ma)"/>
  <text class="lbl" x="790" y="497">config</text>
  <path class="e admin" d="M975 530 V578" marker-end="url(#ma)"/>

  <text class="lbl" x="252" y="607">wireguard</text>

  <!-- Firewall openings -->
  <rect class="chip" x="336" y="194" width="48" height="22" rx="4"/>
  <text class="m" x="360" y="209" text-anchor="middle">2222</text>
  <rect class="chip no" x="336" y="239" width="48" height="22" rx="4"/>
  <text class="m c-deny" x="360" y="254" text-anchor="middle">22 ✕</text>
  <rect class="chip" x="336" y="409" width="48" height="22" rx="4"/>
  <text class="m" x="360" y="424" text-anchor="middle">80·443</text>
  <rect class="chip" x="336" y="597" width="48" height="36" rx="4"/>
  <text class="m" x="360" y="612" text-anchor="middle">51820</text>
  <text class="m" x="360" y="626" text-anchor="middle">21820</text>

  <!-- Outside world -->
  <rect class="box" x="40" y="150" width="200" height="110" rx="8"/>
  <text class="t" x="60" y="182">Admin machine</text>
  <text class="s" x="60" y="202">setup.sh</text>
  <text class="s" x="60" y="220">OpenTofu</text>

  <rect class="box" x="40" y="380" width="200" height="80" rx="8"/>
  <text class="t" x="60" y="412">Browser</text>
  <text class="s" x="60" y="432">pangolin.example.com</text>

  <rect class="box" x="40" y="575" width="200" height="80" rx="8"/>
  <text class="t" x="60" y="607">Sites</text>
  <text class="s" x="60" y="627">Newt</text>

  <rect class="box" x="380" y="30" width="200" height="60" rx="8"/>
  <text class="t" x="400" y="58">Hetzner API</text>
  <text class="s" x="400" y="76">hcloud</text>

  <rect class="box" x="960" y="30" width="200" height="60" rx="8"/>
  <text class="t" x="980" y="58">Let's Encrypt</text>
  <text class="s" x="980" y="76">ACME</text>

  <!-- System -->
  <rect class="box" x="430" y="175" width="200" height="70" rx="8"/>
  <text class="t" x="448" y="203">sshd</text>
  <text class="s" x="448" y="223">public key only</text>

  <rect class="box" x="670" y="175" width="140" height="70" rx="8"/>
  <text class="t" x="688" y="203">fail2ban</text>
  <text class="s" x="688" y="223">nftables</text>

  <rect class="box" x="850" y="175" width="270" height="70" rx="8"/>
  <text class="t" x="868" y="203">unattended-upgrades</text>
  <text class="s" x="868" y="223">reboot at 04:00</text>

  <!-- Containers -->
  <rect class="box" x="450" y="330" width="330" height="350" rx="8"/>
  <text class="t" x="466" y="356">gerbil</text>

  <rect class="box" x="480" y="380" width="270" height="120" rx="8"/>
  <text class="t" x="498" y="410">traefik</text>
  <text class="s" x="498" y="430">TLS · Routing</text>
  <text class="lbl" x="498" y="482">network_mode: gerbil</text>

  <rect class="box" x="480" y="580" width="270" height="70" rx="8"/>
  <text class="t c-wg" x="498" y="608">WireGuard</text>
  <text class="s" x="498" y="628">tunnel endpoint</text>

  <!-- Edges that cross gerbil -->
  <path class="e https" d="M720 380 V300 H825 V60 H958" marker-start="url(#mh)" marker-end="url(#mh)"/>
  <path class="e wg" d="M240 615 H478" marker-end="url(#mw)"/>
  <path class="e wg" d="M615 500 V578" marker-end="url(#mw)"/>

  <rect class="box" x="850" y="330" width="250" height="200" rx="8"/>
  <text class="t" x="868" y="360">pangolin</text>
  <rect class="row" x="862" y="393" width="226" height="24" rx="4"/>
  <text class="m" x="874" y="409">:3002  UI</text>
  <rect class="row" x="862" y="443" width="226" height="24" rx="4"/>
  <text class="m" x="874" y="459">:3000  API</text>
  <rect class="row" x="862" y="493" width="226" height="24" rx="4"/>
  <text class="m" x="874" y="509">:3001  internal</text>

  <rect class="box" x="850" y="580" width="250" height="70" rx="8"/>
  <text class="t" x="868" y="608">config/</text>
  <text class="s" x="868" y="628">SQLite · acme.json · Secrets</text>

  <!-- Legend -->
  <path class="e https" d="M340 762 H380"/><text x="390" y="766">HTTPS</text>
  <path class="e wg" d="M480 762 H520"/><text x="530" y="766">WireGuard</text>
  <path class="e admin" d="M650 762 H690"/><text x="700" y="766">Management</text>
  <path class="e deny" d="M820 762 H860"/><text x="870" y="766">blocked</text>
</svg>
